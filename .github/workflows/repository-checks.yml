name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check porting documents
        shell: bash
        run: |
          test -s README.md
          test -s PORTING.md
          test -s FEATURES.md
          grep -q "не является портом Millida Launcher" README.md
          grep -q "Критерий релиза" PORTING.md
          grep -q "Матрица функций" FEATURES.md
          grep -q "Build Millida Android port" .github/workflows/millida-android.yml
          echo "Documentation checks passed."
