name: Build Millida Android port

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: millida-android-port
  cancel-in-progress: false

jobs:
  android:
    name: Build original Millida UI/core for Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout port scripts
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Clone pinned Millida source
        env:
          SOURCE_SHA: a9cec042ad1515a495a4f7c550e71f7423b65812
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/millida/launcher.git millida
          git -C millida checkout "$SOURCE_SHA"
          test "$(git -C millida rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Apply Android platform adapter
        run: |
          python3 scripts/prepare-millida-android.py "$GITHUB_WORKSPACE/millida"
          git -C millida diff --check

      - name: Install frontend dependencies
        working-directory: millida
        run: bun install --frozen-lockfile

      - name: Build Millida React frontend
        working-directory: millida
        run: bun run build:web

      - name: Set Android NDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Initialize Tauri Android project
        working-directory: millida
        run: bun run tauri android init --ci --config src-tauri/tauri.android.conf.json

      - name: Compile the Millida Android app
        working-directory: millida
        run: bun run tauri android build --apk --target aarch64 --config src-tauri/tauri.android.conf.json

      - name: Collect APKs
        working-directory: millida
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find src-tauri/gen/android -type f -name '*.apk' -print -exec cp '{}' "$GITHUB_WORKSPACE/out/" \;
          test -n "$(find "$GITHUB_WORKSPACE/out" -type f -name '*.apk' -print -quit)"
          sha256sum "$GITHUB_WORKSPACE/out/"*.apk > "$GITHUB_WORKSPACE/out/SHA256SUMS.txt"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Millida-Android-Port-first-build
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 30
