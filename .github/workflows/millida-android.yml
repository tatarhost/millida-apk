name: Build CHEATLAB Android launcher (based on Millida)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: millida-android-port
  cancel-in-progress: false

jobs:
  android:
    name: Build Android launcher UI/core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout port scripts
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Clone pinned Millida source
        env:
          SOURCE_SHA: a9cec042ad1515a495a4f7c550e71f7423b65812
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/millida/launcher.git millida
          git -C millida checkout "$SOURCE_SHA"
          test "$(git -C millida rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Validate Android preparation scripts
        run: |
          python3 -m py_compile scripts/prepare-millida-android.py scripts/prepare-android-experience.py

      - name: Apply Android platform adapter
        run: |
          python3 scripts/prepare-millida-android.py "$GITHUB_WORKSPACE/millida"
          python3 scripts/prepare-android-experience.py "$GITHUB_WORKSPACE/millida"
          git -C millida diff --check

      - name: Install frontend dependencies
        working-directory: millida
        run: bun install --frozen-lockfile

      - name: Build CHEATLAB Launcher React frontend
        working-directory: millida
        run: bun run build:web

      - name: Set Android NDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Initialize Tauri Android project
        working-directory: millida
        run: bun run tauri android init --ci --config src-tauri/tauri.android.conf.json

      - name: Compile the CHEATLAB Android app
        working-directory: millida
        run: bun run tauri android build --apk --target aarch64 --config src-tauri/tauri.android.conf.json

      - name: Sign Android APK for installation
        working-directory: millida
        env:
          TEST_KEYSTORE_PASSWORD: millida-android-test
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/millida-test.keystore"
          keytool -genkeypair -noprompt -v \
            -keystore "$KEYSTORE" \
            -storepass "$TEST_KEYSTORE_PASSWORD" \
            -keypass "$TEST_KEYSTORE_PASSWORD" \
            -alias millida-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Unofficial Millida Android Port, O=TatarHost, C=US"

          mapfile -t APKS < <(find src-tauri/gen/android -type f -name '*-release-unsigned.apk' -print)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No release-unsigned.apk was produced by Tauri"
            find src-tauri/gen/android -type f -name '*.apk' -print
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$GITHUB_WORKSPACE/out"
          for APK in "${APKS[@]}"; do
            BASE="$(basename "$APK" -release-unsigned.apk)"
            ALIGNED="$RUNNER_TEMP/${BASE}-aligned.apk"
            SIGNED="$GITHUB_WORKSPACE/out/${BASE}-signed.apk"
            "$BUILD_TOOLS/zipalign" -f -v 4 "$APK" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias millida-test \
              --ks-pass "pass:$TEST_KEYSTORE_PASSWORD" \
              --key-pass "pass:$TEST_KEYSTORE_PASSWORD" \
              --out "$SIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          done
          sha256sum "$GITHUB_WORKSPACE/out/"*.apk > "$GITHUB_WORKSPACE/out/SHA256SUMS.txt"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHEATLAB-Android-Launcher
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 30
